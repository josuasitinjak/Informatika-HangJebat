<!-- character traits -->
<text x="896" y="531" fill="#91A7D7" font-family="Arial,sans-serif" font-size="16" letter-spacing="4">KARAKTER</text>
<g font-family="Arial,sans-serif">
 <g><rect x="896" y="553" width="404" height="139" rx="24" fill="#FFFFFF" fill-opacity=".025" stroke="#A9B9DC" stroke-opacity=".18" stroke-width="2"/><path d="m926 589 9-9 9 9-9 9-9-9Z" fill="#526AFF" filter="url(#glow)"/><text x="958" y="596" fill="#F3F5FF" font-size="22" font-weight="700">Tegap &amp; berwibawa</text><text x="926" y="634" fill="#AAB9D7" font-size="16">Bahu berlapis, lensa optik presisi,</text><text x="926" y="660" fill="#AAB9D7" font-size="16">postur siap menjaga ruang belajar.</text></g>
 <g><rect x="1318" y="553" width="418" height="139" rx="24" fill="#FFFFFF" fill-opacity=".025" stroke="#A9B9DC" stroke-opacity=".18" stroke-width="2"/><path d="m1348 589 9-9 9 9-9 9-9-9Z" fill="#526AFF" filter="url(#glow)"/><text x="1380" y="596" fill="#F3F5FF" font-size="22" font-weight="700">Ramah &amp; responsif</text><text x="1348" y="634" fill="#AAB9D7" font-size="16">Cahaya mata berubah ekspresif;</text><text x="1348" y="660" fill="#AAB9D7" font-size="16">tatapan mengikuti arah perhatian.</text></g>
 <g><rect x="896" y="709" width="404" height="139" rx="24" fill="#FFFFFF" fill-opacity=".025" stroke="#A9B9DC" stroke-opacity=".18" stroke-width="2"/><path d="m926 745 9-9 9 9-9 9-9-9Z" fill="#526AFF" filter="url(#glow)"/><text x="958" y="752" fill="#F3F5FF" font-size="22" font-weight="700">Material 3D detail</text><text x="926" y="790" fill="#AAB9D7" font-size="16">Krom berkilau, sambungan gelap,</text><text x="926" y="816" fill="#AAB9D7" font-size="16">pantulan tepi dan bayangan lembut.</text></g>
 <g><rect x="1318" y="709" width="418" height="139" rx="24" fill="#FFFFFF" fill-opacity=".025" stroke="#A9B9DC" stroke-opacity=".18" stroke-width="2"/><path d="m1348 745 9-9 9 9-9 9-9-9Z" fill="#526AFF" filter="url(#glow)"/><text x="1380" y="752" fill="#F3F5FF" font-size="22" font-weight="700">Siap jadi teman belajar</text><text x="1348" y="790" fill="#AAB9D7" font-size="16">Inti energi menyala saat belajar;</text><text x="1348" y="816" fill="#AAB9D7" font-size="16">lambaian menyambut pengguna.</text></g>
