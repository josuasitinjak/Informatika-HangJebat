<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catatan Belajar — Informatika SMAN 1 Batam</title>
  <meta name="description" content="Buku catatan belajar Informatika: tulis, cari, sematkan, dan ekspor rangkuman.">
  <script>if (!localStorage.getItem('xavetra_user')) location.replace('login.html?redirect=catatan.html');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tw-config.js"></script>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/hj.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0A0E1C">
</head>
<body class="bg-canvas text-text-main font-sans min-h-screen antialiased flex">
  <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-navy/40 z-40 hidden lg:hidden backdrop-blur-sm"></div>
  <aside id="main-sidebar" class="fixed top-0 bottom-0 left-0 z-50 w-72 bg-white border-r border-slate-200/80 flex flex-col transition-transform duration-300 -translate-x-full lg:translate-x-0"></aside>

  <div class="flex-1 min-w-0 lg:ml-72 flex flex-col min-h-screen">
    <header class="hj-topbar sticky top-0 z-30 bg-white/85 backdrop-blur-md border-b border-slate-200/80 px-3 sm:px-8 h-16 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2 flex-1 min-w-0">
        <button onclick="toggleSidebar()" class="lg:hidden p-2 rounded-xl text-slate-600 hover:bg-slate-100" aria-label="Buka menu"><span class="material-symbols-outlined">menu</span></button>
        <div class="relative w-full max-w-md">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[19px]">search</span>
          <input id="search" type="search" placeholder="Cari di catatanmu…" class="w-full bg-slate-100/80 border border-transparent rounded-2xl pl-10 pr-4 py-2 text-xs text-navy focus:outline-none focus:border-primary focus:bg-white focus:ring-4 focus:ring-primary/10 transition">
        </div>
      </div>
      <button type="button" onclick="exportNotesTxt()" class="shrink-0 inline-flex items-center gap-1.5 px-3.5 py-2 rounded-2xl bg-white border-2 border-slate-200 text-xs font-bold text-navy hover:border-primary"><span class="material-symbols-outlined text-[17px]">download</span><span class="hidden sm:inline">Ekspor .txt</span></button>
    </header>

    <main data-m-page class="flex-grow p-4 sm:p-8 max-w-6xl mx-auto w-full space-y-6">
      <section class="flex items-end justify-between gap-4">
        <div>
          <div class="text-[11px] font-black tracking-[0.18em] text-emerald-600">BUKU CATATAN</div>
          <h1 class="text-2xl sm:text-4xl font-black text-navy tracking-tight mt-1">Catatan Belajar</h1>
          <p class="text-sm text-text-muted mt-1">Menulis ulang dengan bahasamu sendiri = cara paling ampuh biar materi nempel. ✍️</p>
        </div>
        <div class="hidden sm:block text-right"><div class="text-3xl font-black text-navy" id="total">0</div><div class="text-[11px] font-bold text-text-muted">catatan</div></div>
      </section>

      <!-- Tulis -->
      <section class="bg-white rounded-[28px] border-2 border-slate-200 p-5 sm:p-6" id="composer">
        <div class="flex flex-wrap items-center gap-2">
          <span class="text-xs font-black text-navy mr-1">Template cepat:</span>
          <button type="button" data-tpl="operator" class="token-chip px-3 py-1.5 rounded-xl bg-violet-50 border-2 border-violet-200 text-xs font-bold text-violet-800">🔎 Operator</button>
          <button type="button" data-tpl="triangulasi" class="token-chip px-3 py-1.5 rounded-xl bg-sky-50 border-2 border-sky-200 text-xs font-bold text-sky-800">🔺 Triangulasi</button>
          <button type="button" data-tpl="ite" class="token-chip px-3 py-1.5 rounded-xl bg-orange-50 border-2 border-orange-200 text-xs font-bold text-orange-800">⚖️ Pasal UU ITE</button>
          <button type="button" data-tpl="cc" class="token-chip px-3 py-1.5 rounded-xl bg-emerald-50 border-2 border-emerald-200 text-xs font-bold text-emerald-800">© Lisensi CC</button>
        </div>
        <div class="mt-4 grid sm:grid-cols-[1fr_220px] gap-3">
          <input id="note-title-input" maxlength="120" placeholder="Judul catatan" class="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl px-4 py-3 text-sm font-bold focus:outline-none focus:border-primary focus:bg-white">
          <select id="note-chapter-select" class="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl px-3 py-3 text-sm font-bold focus:outline-none focus:border-primary"></select>
        </div>
        <textarea id="note-body-input" rows="4" maxlength="6000" placeholder="Tulis pemahamanmu, contoh query, atau pasal yang perlu diingat…" class="mt-3 w-full bg-slate-50 border-2 border-slate-200 rounded-2xl p-4 text-sm focus:outline-none focus:border-primary focus:bg-white resize-y"></textarea>
        <div class="mt-3 flex flex-wrap items-center justify-between gap-3">
          <div class="flex items-center gap-1.5" id="colors" aria-label="Warna catatan"></div>
          <div class="flex gap-2">
            <button type="button" id="btn-cancel" class="hidden px-4 py-3 rounded-2xl bg-white border-2 border-b-4 border-slate-200 text-sm font-black text-navy">Batal</button>
            <button type="button" id="btn-save" class="px-6 py-3 rounded-2xl bg-emerald-500 text-white text-sm font-black border-b-4 border-emerald-700 active:translate-y-0.5 active:border-b-2 transition">Simpan Catatan</button>
          </div>
        </div>
      </section>

      <!-- Filter -->
      <section class="flex gap-2 overflow-x-auto thin-scroll pb-1" id="filters"></section>

      <section id="notes" class="columns-1 sm:columns-2 lg:columns-3 gap-4 [column-fill:_balance]"></section>
    </main>
  </div>

  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
  <!-- Motion (dulu Framer Motion): global window.Motion -->
  <script src="https://cdn.jsdelivr.net/npm/motion@12.23.12/dist/motion.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/motion-ui.js"></script>
  <script src="assets/js/cursor-glow.js"></script>
  <script src="assets/js/content.js"></script>
  <script>
    function toggleSidebar() {
      document.getElementById('main-sidebar').classList.toggle('-translate-x-full');
      document.getElementById('sidebar-overlay').classList.toggle('hidden');
    }
    const esc = X.esc;
    const KEY = 'xavetra_student_notes';
    const COLORS = {
      yellow: ['#FEF9C3', '#FDE047'], blue: ['#DBEAFE', '#60A5FA'], green: ['#DCFCE7', '#4ADE80'], pink: ['#FCE7F3', '#F472B6'], violet: ['#EDE9FE', '#A78BFA'],
    };
    let filter = 'all', query = '', editId = null, color = 'yellow';

    const labels = XContent.CHAPTERS.map((c) => `Bab ${String(c.number).padStart(2, '0')}: ${c.short}`)
      .concat((X.readJSON('xavetra_custom_chapters', []) || []).filter((c) => c && c.title).map((c) => String(c.title)))
      .concat(['Catatan Umum']);
    document.getElementById('note-chapter-select').innerHTML = labels.map((l) => `<option value="${esc(l)}">${esc(l)}</option>`).join('');

    function getNotes() { return (X.readJSON(KEY, []) || []).filter((n) => n && n.id); }
    function setNotes(n) { if (!X.writeJSON(KEY, n)) showToast('Penyimpanan perangkat penuh.', 'alert'); }

    function renderColors() {
      document.getElementById('colors').innerHTML = Object.entries(COLORS).map(([k, [bg, bd]]) => `<button type="button" data-color="${k}" aria-label="Warna ${k}" class="w-7 h-7 rounded-full border-2 transition ${color === k ? 'scale-110 ring-4 ring-primary/20' : ''}" style="background:${bg};border-color:${bd}"></button>`).join('');
    }
    document.getElementById('colors').addEventListener('click', (e) => { const b = e.target.closest('[data-color]'); if (!b) return; color = b.dataset.color; X.sfx.click(); renderColors(); });

    function renderFilters(notes) {
      const cats = ['all', ...new Set(notes.map((n) => n.chapter || 'Catatan Umum'))];
      document.getElementById('filters').innerHTML = cats.map((c) => {
        const count = c === 'all' ? notes.length : notes.filter((n) => (n.chapter || 'Catatan Umum') === c).length;
        const on = filter === c;
        return `<button type="button" data-f="${esc(c)}" class="shrink-0 px-3.5 py-2 rounded-2xl text-xs font-extrabold border-2 transition ${on ? 'bg-navy text-white border-navy' : 'bg-white text-slate-600 border-slate-200 hover:border-primary'}">${c === 'all' ? 'Semua' : esc(c)} <span class="opacity-60">${count}</span></button>`;
      }).join('');
    }
    document.getElementById('filters').addEventListener('click', (e) => { const b = e.target.closest('[data-f]'); if (!b) return; filter = b.dataset.f; X.sfx.click(); render(); });

    function render() {
      const all = getNotes();
      document.getElementById('total').textContent = all.length;
      if (filter !== 'all' && !all.some((n) => (n.chapter || 'Catatan Umum') === filter)) filter = 'all';
      renderFilters(all);
      let list = filter === 'all' ? all : all.filter((n) => (n.chapter || 'Catatan Umum') === filter);
      if (query) list = list.filter((n) => `${n.title} ${n.body || n.content || ''} ${n.chapter || ''}`.toLowerCase().includes(query));
      list = list.slice().sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
      const box = document.getElementById('notes');
      if (!list.length) {
        box.className = '';
        box.innerHTML = `<div class="p-10 text-center rounded-[28px] border-2 border-dashed border-slate-300 bg-white"><div class="flex justify-center">${X.mascot(query ? 'think' : 'idle', 84)}</div>
          <div class="font-black text-navy mt-3">${query ? 'Tidak ada catatan yang cocok' : 'Belum ada catatan'}</div><div class="text-xs text-text-muted mt-1">${query ? 'Coba kata kunci lain.' : 'Mulai dari template cepat di atas — tinggal sunting.'}</div></div>`;
        return;
      }
      box.className = 'columns-1 sm:columns-2 lg:columns-3 gap-4';
      box.innerHTML = list.map((n, i) => {
        const [bg, bd] = COLORS[n.color] || COLORS.yellow;
        const id = String(n.id).replace(/[^\w-]/g, '');
        return `<article class="note-card break-inside-avoid mb-4 rounded-[24px] p-5 border-2 relative group" style="background:${bg};border-color:${bd}55;animation:staggerIn 450ms cubic-bezier(.22,1,.36,1) ${Math.min(i, 8) * 50}ms both;transform:rotate(${(i % 3 - 1) * 0.6}deg)">
          ${n.pinned ? '<span class="absolute -top-2 left-1/2 -translate-x-1/2 text-xl" title="Disematkan">📌</span>' : ''}
          <div class="flex items-start justify-between gap-2">
            <span class="text-[10px] font-black px-2 py-0.5 rounded-full bg-white/70 text-slate-700">${esc(n.chapter || 'Catatan Umum')}</span>
            <div class="flex gap-0.5 opacity-60 group-hover:opacity-100 transition">
              <button type="button" data-act="pin" data-id="${id}" class="p-1 rounded-lg hover:bg-white/60" aria-label="Sematkan"><span class="material-symbols-outlined text-[17px] text-slate-700 ${n.pinned ? 'icon-fill' : ''}">push_pin</span></button>
              <button type="button" data-act="edit" data-id="${id}" class="p-1 rounded-lg hover:bg-white/60" aria-label="Sunting"><span class="material-symbols-outlined text-[17px] text-slate-700">edit</span></button>
              <button type="button" data-act="del" data-id="${id}" class="p-1 rounded-lg hover:bg-white/60" aria-label="Hapus"><span class="material-symbols-outlined text-[17px] text-red-600">delete</span></button>
            </div>
          </div>
          <h3 class="text-base font-black text-slate-900 mt-2 leading-snug">${esc(n.title)}</h3>
          <p class="text-[13px] text-slate-800 mt-1.5 whitespace-pre-line leading-relaxed">${esc(n.body || n.content || '')}</p>
          <div class="text-[10px] font-bold text-slate-500 mt-3">${esc(n.date || '')}</div>
        </article>`;
      }).join('');
    }

    document.getElementById('notes').addEventListener('click', (e) => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      const notes = getNotes();
      const n = notes.find((x) => String(x.id).replace(/[^\w-]/g, '') === b.dataset.id);
      if (!n) return;
      if (b.dataset.act === 'pin') { n.pinned = !n.pinned; setNotes(notes); X.sfx.pop(); render(); }
      if (b.dataset.act === 'del') {
        if (!confirm(`Hapus catatan "${n.title}"?`)) return;
        setNotes(notes.filter((x) => x !== n)); X.sfx.click(); showToast('Catatan dihapus.', 'warning'); render();
      }
      if (b.dataset.act === 'edit') {
        editId = n.id;
        document.getElementById('note-title-input').value = n.title || '';
        document.getElementById('note-body-input').value = n.body || n.content || '';
        const sel = document.getElementById('note-chapter-select');
        if (![...sel.options].some((o) => o.value === n.chapter)) sel.insertAdjacentHTML('beforeend', `<option value="${esc(n.chapter || 'Catatan Umum')}">${esc(n.chapter || 'Catatan Umum')}</option>`);
        sel.value = n.chapter || 'Catatan Umum';
        color = n.color || 'yellow'; renderColors();
        document.getElementById('btn-save').textContent = 'Simpan Perubahan';
        document.getElementById('btn-cancel').classList.remove('hidden');
        document.getElementById('composer').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });

    function resetComposer() {
      editId = null;
      document.getElementById('note-title-input').value = '';
      document.getElementById('note-body-input').value = '';
      document.getElementById('btn-save').textContent = 'Simpan Catatan';
      document.getElementById('btn-cancel').classList.add('hidden');
    }
    document.getElementById('btn-cancel').addEventListener('click', resetComposer);
    document.getElementById('btn-save').addEventListener('click', () => {
      const title = document.getElementById('note-title-input').value.trim();
      const body = document.getElementById('note-body-input').value.trim();
      const chapter = document.getElementById('note-chapter-select').value;
      if (!title || !body) { showToast('Isi judul dan catatannya dulu ya.', 'warning'); document.getElementById('composer').classList.add('anim-shake'); setTimeout(() => document.getElementById('composer').classList.remove('anim-shake'), 500); return; }
      const notes = getNotes();
      if (editId) {
        const n = notes.find((x) => x.id === editId);
        if (n) Object.assign(n, { title, body, chapter, color });
        delete (n || {}).content;
      } else {
        notes.unshift({ id: 'note_' + Date.now(), chapter, title, body, color, date: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) });
        if (notes.length >= 3) X.grantBadge('note_taker');
      }
      setNotes(notes);
      X.sfx.pop();
      showToast(editId ? 'Catatan diperbarui ✨' : 'Catatan tersimpan 📝');
      resetComposer();
      render();
    });

    const TPL = {
      operator: ['Bab 01: Mesin Pencari', 'Rumus Operator Pencarian', '"frasa" → cari frasa persis\n-kata → kecualikan kata\nsite:go.id → hanya situs pemerintah\nfiletype:pdf → hanya PDF\nkata1 OR kata2 → salah satu\nintitle:kata → kata wajib di judul'],
      triangulasi: ['Bab 02: Strategi Riset', 'Triangulasi 3 Sumber', '1. Lembaga resmi (.go.id / .ac.id)\n2. Media terverifikasi Dewan Pers\n3. Pakar / jurnal ilmiah\nIngat SIFT: Stop – Investigate – Find – Trace'],
      ite: ['Bab 02: Hukum Digital', 'Pasal Penting UU ITE (UU 1/2024)', 'Pasal 27: kesusilaan & judi (27A pencemaran, 27B pemerasan)\nPasal 28(1): berita bohong merugikan konsumen\nPasal 28(2): ujaran kebencian SARA\nPasal 28(3): hoaks yang memicu kerusuhan\nPasal 30: akses ilegal\nPasal 32: merusak/membocorkan data'],
      cc: ['Bab 02: Hukum Digital', 'Kode Lisensi Creative Commons', 'BY = wajib cantumkan nama\nNC = tidak untuk komersial\nSA = turunan pakai lisensi sama\nND = tidak boleh diubah\nCC0 = domain publik\nAtribusi: Judul – Pencipta – Sumber – Lisensi'],
    };
    document.querySelectorAll('[data-tpl]').forEach((b) => b.addEventListener('click', () => {
      const [ch, t, body] = TPL[b.dataset.tpl];
      document.getElementById('note-chapter-select').value = ch;
      document.getElementById('note-title-input').value = t;
      document.getElementById('note-body-input').value = body;
      X.sfx.pop();
    }));

    let st;
    document.getElementById('search').addEventListener('input', (e) => { clearTimeout(st); st = setTimeout(() => { query = e.target.value.trim().toLowerCase(); render(); }, 150); });

    function exportNotesTxt() {
      const notes = getNotes();
      if (!notes.length) { showToast('Belum ada catatan untuk diekspor.', 'warning'); return; }
      const u = X.getUser() || {};
      let out = `CATATAN BELAJAR INFORMATIKA – SMAN 1 BATAM\nNama: ${u.name || '-'}\nTanggal ekspor: ${new Date().toLocaleDateString('id-ID')}\n${'='.repeat(48)}\n\n`;
      notes.forEach((n, i) => { out += `[${i + 1}] ${String(n.title || '').toUpperCase()}\nBab: ${n.chapter || 'Catatan Umum'} | ${n.date || '-'}\n${n.body || n.content || ''}\n${'-'.repeat(48)}\n\n`; });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([out], { type: 'text/plain;charset=utf-8' }));
      a.download = `Catatan_Informatika_${X.todayKey()}.txt`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      showToast('Berkas catatan diunduh 📄');
    }

    renderColors();
    render();
  </script>
</body>
</html>
